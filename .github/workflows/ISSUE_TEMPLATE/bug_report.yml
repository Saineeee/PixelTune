name: 🐛 Bug report
description: Report something broken or behaving unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in the details below —
        the more precise the report, the faster the fix.
        **Search open and closed issues first** to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem — expected vs. actual behavior.
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered, minimal steps that reliably trigger the issue.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See error
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Affected source
      description: Which music source does this affect?
      options:
        - Local files
        - YouTube / YouTube Music
        - SoundCloud
        - NetEase Cloud Music
        - Telegram
        - Google Drive
        - Downloads
        - Wear OS / widgets
        - Not source-specific
        - Other
    validations:
      required: true

  - type: dropdown
    id: android
    attributes:
      label: Android version
      options:
        - "16"
        - "15"
        - "14"
        - "13"
        - "12"
        - "11"
        - "10"
        - Other / unsure
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device model
      description: The physical device or emulator this happened on.
      placeholder: e.g. Pixel 8 Pro, Galaxy S24
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: PixelTune version
      description: From Settings → About, or the APK filename (e.g. 0.7.0-beta).
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / crash trace
      description: |
        `adb logcat` output around the failure, or a crash stack trace.
        In-app: Settings → About exposes debug options.
        Wrap large logs in triple backticks and remove any personal data.
      render: shell

  - type: textarea
    id: media
    attributes:
      label: Screenshots / screen recording
      description: Attach or link them. Blur personal data (file names, cloud IDs, chats).

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues (open and closed) for duplicates
          required: true
        - label: This happens on the latest release/beta of PixelTune
          required: true
        - label: I can provide additional logs or details if asked
