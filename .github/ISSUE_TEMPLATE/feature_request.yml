name: Feature request
description: Suggest an idea or improvement for PixelTune
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Lead with the **problem**, not the solution: what were you trying to do,
        and what got in your way? Proposals that describe the use case get better
        feedback and are easier to accept. **Check existing requests first.**

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do? What is missing or annoying today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? Keep it concrete.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other apps, workarounds, or designs you thought of.

  - type: dropdown
    id: new-dependency
    attributes:
      label: Does this need a new service, permission, or third-party library?
      description: |
        New dependencies get extra review — they must be actively maintained and
        GPL-compatible (see the dependency policy in CONTRIBUTING.md).
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Willing to help implement?
      options:
        - "Yes — I can open a PR"
        - "Yes — with guidance"
        - "No, just suggesting"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing feature requests for duplicates
          required: true
        - label: This fits PixelTune's scope — a personal, local-first music player
